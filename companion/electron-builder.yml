appId: com.hanbroz.claudedeck.companion
productName: Code Deck Companion
copyright: Copyright (c) Hanbroz
directories:
  output: dist/companion
files:
  - "dist/companion/app/**/*"
  - "package.json"
asar: true
asarUnpack:
  - "**/node-pty/**"
# node-pty is a node-addon-api (Node-API) module and ships prebuilds for each
# platform, e.g. prebuilds/win32-x64. Node-API binaries are ABI-stable, so they
# load in Electron exactly as they do in Node — both `companion:dir` and release
# packaging use the prebuild. A source rebuild buys nothing here and needs a
# Visual Studio that node-gyp can detect, which it cannot on VS 18.
npmRebuild: false
win:
  icon: companion/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Code Deck Companion Setup ${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  include: companion/packaging/nsis/wt-prerequisite.nsh
  license: LICENSE
extraResources:
  - from: dist/com.hanbroz.claude-usage.streamDeckPlugin
    to: com.hanbroz.claude-usage.streamDeckPlugin
  - from: docs/INSTALL_WINDOWS_KO.html
    to: INSTALL_WINDOWS_KO.html
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
